		<main>
			<h2>Dog Years Calculator</h2>
			<section>
				<p>Please input your current age:</p>
				
				<fieldset>
				<legend>Dog Years Calculator</legend>
				<form id="DogForm">
					<label for="myName">My name is: </label> <br>
					<input type="text" id="myName" name="myName" placeholder="e.g. Jim Gordon" required> <br><br>
					
					<label for="myAge">My age is: </label> <br>
					<input type="number" id="myAge" name="myAge" placeholder="e.g. 44" required min="1" max="500"> <br><br>
					
					<button type="button" value="Submit" onclick="calculateDogYears()">Calculate</button>
				</form>
				</fieldset>
			</section>
			<br><br>
			<section class="outputText">
				<p id="myOutput"></p>
			</section>
		</main>
